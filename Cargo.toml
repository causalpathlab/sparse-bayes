[package]
name = "sparse-bayes"
version = "0.1.0"
authors = ["Yongjin Park <ypp@stat.ubc.ca>"]
edition = "2021"
license = "MIT"
description = "Bayesian sparse regression: SGVB variational families (SuSiE, spike-and-slab, multilevel SuSiE) and an elliptical-slice MCMC engine"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "legume-numeric/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "legume-numeric/metal"]

[dependencies]
anyhow = "1.0"
rayon = "1.10.0"
rand = "0.10.1"
rand_distr = "0.6"
nalgebra = "0.34"
parquet = "59"
log = "0.4"
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
legume-numeric = { version = "0.9", default-features = false, features = ["matrix", "tensor"] }

[dev-dependencies]
tempfile = "3.2"
rustc-hash = "2.1"
